<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>부산 바다, 오늘</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">

<!-- 지도 라이브러리 -->
<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
background:#f4ecd8;
font-family:'Noto Sans KR',sans-serif;
color:#0a2a2e;
}

button{
font-family:inherit;
}

#app{
max-width:460px;
min-height:100vh;
margin:auto;
background:#f4ecd8;
padding-bottom:85px;
}

/* =====================
 HEADER
===================== */

header{
background:linear-gradient(145deg,#0d3d40,#071f23);
color:white;
padding:25px 22px 35px;
}

.eyebrow{
font-size:11px;
letter-spacing:2px;
color:#9fd3c8;
font-weight:700;
margin-bottom:6px;
}

header h1{
font-family:'Noto Serif KR',serif;
font-size:27px;
margin:0 0 5px;
}

.sub{
font-size:12px;
color:#bfe0d8;
}

/* =====================
 PANEL
===================== */

.panel{
display:none;
}

.panel.active{
display:block;
}

section{
padding:20px;
}

.label{
font-size:12px;
font-weight:900;
color:#1b6e6a;
letter-spacing:1px;
margin-bottom:11px;
}

/* =====================
 HOME
===================== */

.trends{
display:flex;
gap:8px;
overflow-x:auto;
}

.trend{
background:white;
border:1px solid #dfe5df;
border-radius:20px;
padding:8px 13px;
font-size:12px;
font-weight:700;
white-space:nowrap;
}

.brief{
background:white;
border-radius:18px;
padding:19px;
box-shadow:0 7px 20px rgba(13,61,64,.1);
}

.brief h2{
font-family:'Noto Serif KR',serif;
font-size:20px;
margin:0 0 5px;
}

.brief p{
font-size:13px;
line-height:1.6;
color:#49615e;
}

.metrics{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:15px;
}

.metric{
background:#f4ecd8;
border-radius:12px;
padding:10px 5px;
text-align:center;
}

.metric strong{
display:block;
font-size:15px;
}

.metric span{
font-size:10px;
color:#718582;
}

/* =====================
 BEACH
===================== */

.beaches{
display:flex;
gap:8px;
overflow-x:auto;
}

.beach{
border:1px solid #dce4df;
background:white;
border-radius:20px;
padding:8px 13px;
white-space:nowrap;
font-size:12px;
font-weight:700;
}

.beach.active{
background:#1b6e6a;
color:white;
}

/* =====================
 MAP
===================== */

.map-filter{
display:flex;
gap:7px;
overflow-x:auto;
margin-bottom:10px;
}

.map-filter button{
border:1px solid #d8e0dc;
background:white;
border-radius:20px;
padding:8px 12px;
font-size:11px;
font-weight:700;
white-space:nowrap;
}

.map-filter button.active{
background:#1b6e6a;
color:white;
}

.map-box{
position:relative;
height:480px;
border-radius:18px;
overflow:hidden;
box-shadow:0 8px 20px rgba(13,61,64,.12);
}

#map{
width:100%;
height:100%;
}

.location-button{
position:absolute;
right:12px;
bottom:12px;
z-index:1000;
border:0;
border-radius:12px;
background:white;
padding:11px 14px;
font-size:12px;
font-weight:900;
box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.legend{
display:flex;
gap:10px;
flex-wrap:wrap;
font-size:10px;
color:#657875;
margin-top:9px;
}

/* =====================
 PLACE CARDS
===================== */

.card-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.place-card{
background:white;
border-radius:16px;
padding:15px;
box-shadow:0 6px 16px rgba(13,61,64,.08);
cursor:pointer;
}

.place-icon{
font-size:27px;
}

.place-card h3{
font-family:'Noto Serif KR',serif;
font-size:14px;
margin:8px 0 4px;
}

.place-card p{
font-size:11px;
color:#71817e;
margin:0;
}

/* =====================
 COURSE
===================== */

.group-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.group{
background:white;
border:1px solid #dce4df;
border-radius:13px;
padding:12px 4px;
text-align:center;
cursor:pointer;
}

.group.active{
background:#ef7350;
color:white;
}

.group-icon{
font-size:20px;
display:block;
}

.group-name{
font-size:11px;
font-weight:700;
}

.course{
background:white;
border-radius:18px;
padding:15px;
box-shadow:0 7px 18px rgba(13,61,64,.08);
}

.course-item{
display:flex;
gap:10px;
padding:13px 0;
border-bottom:1px solid #edf0ed;
cursor:pointer;
}

.course-item:last-child{
border-bottom:0;
}

.course-icon{
width:35px;
height:35px;
border-radius:50%;
background:#1b6e6a;
color:white;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
}

.course-food{
background:#ef7350;
}

.course-title{
font-weight:800;
font-size:13px;
}

.course-time{
font-size:10px;
color:#1b6e6a;
margin-bottom:2px;
}

.course-desc{
font-size:11px;
color:#71817e;
}

/* =====================
 MY COURSE
===================== */

.type-buttons{
display:flex;
gap:8px;
margin-bottom:12px;
}

.type-buttons button{
flex:1;
border:0;
background:#eee7d5;
padding:10px;
border-radius:10px;
font-weight:700;
}

.type-buttons button.active{
background:#1b6e6a;
color:white;
}

.add-list{
display:flex;
flex-wrap:wrap;
gap:7px;
}

.add-place{
border:0;
background:#f4ecd8;
border-radius:20px;
padding:8px 11px;
font-size:11px;
font-weight:700;
}

.my-list{
margin-top:16px;
}

.empty{
text-align:center;
font-size:12px;
color:#9aa9a6;
padding:18px;
}

.my-item{
display:flex;
align-items:center;
gap:9px;
background:#f4ecd8;
border-radius:11px;
padding:10px;
margin-bottom:7px;
}

.my-num{
width:23px;
height:23px;
background:#1b6e6a;
border-radius:50%;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
}

.my-name{
flex:1;
font-size:12px;
font-weight:700;
}

.remove{
border:0;
background:none;
font-size:16px;
}

/* =====================
 MODAL
===================== */

.modal-bg{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:2000;
align-items:flex-end;
}

.modal-bg.open{
display:flex;
}

.modal{
width:100%;
max-width:460px;
margin:auto;
background:white;
border-radius:20px 20px 0 0;
padding:22px;
}

.modal-close{
float:right;
border:0;
background:#eee;
width:30px;
height:30px;
border-radius:50%;
}

.modal h2{
font-family:'Noto Serif KR',serif;
font-size:20px;
margin-top:15px;
}

.modal-type{
color:#1b6e6a;
font-size:12px;
font-weight:700;
}

.modal p{
font-size:13px;
line-height:1.6;
color:#536764;
}

.add-course{
width:100%;
border:0;
background:#ef7350;
color:white;
padding:12px;
border-radius:12px;
font-weight:800;
}

/* =====================
 NAV
===================== */

#bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
max-width:460px;
margin:auto;
background:white;
border-top:1px solid #dfe5df;
display:flex;
z-index:1500;
}

.nav-btn{
flex:1;
border:0;
background:white;
color:#8c9b98;
font-weight:700;
font-size:10px;
}

.nav-icon{
display:block;
font-size:20px;
margin-bottom:3px;
}

.nav-btn.active{
color:#1b6e6a;
}

</style>
</head>


<body>

<div id="app">

<header>

<div class="eyebrow" id="date"></div>

<h1>부산 바다, 오늘</h1>

<div class="sub">
그날의 바다를 읽고, 오늘 가장 좋은 코스를 추천해요
</div>

</header>


<!-- =====================
 HOME
===================== -->

<div class="panel active" id="home">

<section>

<div class="label">
오늘의 인기 검색어
</div>

<div class="trends">

<div class="trend">#다대포노을</div>
<div class="trend">#광안리</div>
<div class="trend">#흰여울문화마을</div>
<div class="trend">#송정서핑</div>

</div>

</section>


<section>

<div class="label">
오늘의 바다 브리핑
</div>

<div class="brief">

<h2 id="beach-name">
해운대
</h2>

<p id="beach-comment">
파도가 잔잔하고 하늘이 맑아요. 산책과 사진 찍기 좋은 날입니다.
</p>

<div class="metrics">

<div class="metric">
<strong id="wave">0.3m</strong>
<span>파도 높이</span>
</div>

<div class="metric">
<strong id="temp">24°C</strong>
<span>수온</span>
</div>

<div class="metric">
<strong id="tide">간조 14:20</strong>
<span>물때</span>
</div>

</div>

</div>

</section>


<section>

<div class="label">
해변 선택
</div>

<div class="beaches">

<button class="beach active" data-beach="해운대">
해운대
</button>

<button class="beach" data-beach="광안리">
광안리
</button>

<button class="beach" data-beach="송정">
송정
</button>

<button class="beach" data-beach="다대포">
다대포
</button>

</div>

</section>

</div>


<!-- =====================
 MAP
===================== -->

<div class="panel" id="map-panel">

<section>

<div class="label">
부산 바다 지도
</div>

<div class="map-filter">

<button class="active" data-filter="all">
전체
</button>

<button data-filter="spot">
🔵 관광지
</button>

<button data-filter="food">
🟠 음식점
</button>

<button data-filter="leisure">
🟢 레저
</button>

</div>

<div class="map-box">

<div id="map"></div>

<button class="location-button" id="location-btn">
📍 현재 위치
</button>

</div>

<div class="legend">

<span>🔵 관광지</span>
<span>🟠 음식점</span>
<span>🟢 레저</span>
<span>🔴 현재 위치</span>

</div>

</section>

</div>


<!-- =====================
 PLACES
===================== -->

<div class="panel" id="places">

<section>

<div class="label">
부산 바다 명소
</div>

<div class="card-grid" id="place-grid"></div>

</section>

</div>


<!-- =====================
 COURSE
===================== -->

<div class="panel" id="course">

<section>

<div class="label">
누구와 가시나요?
</div>

<div class="group-grid">

<div class="group active" data-group="solo">
<span class="group-icon">🚶</span>
<span class="group-name">혼자</span>
</div>

<div class="group" data-group="couple">
<span class="group-icon">💑</span>
<span class="group-name">커플</span>
</div>

<div class="group" data-group="family">
<span class="group-icon">👨‍👩‍👧</span>
<span class="group-name">가족</span>
</div>

<div class="group" data-group="friends">
<span class="group-icon">🎉</span>
<span class="group-name">친구</span>
</div>

</div>

</section>


<section>

<div class="label">
오늘의 추천 코스
</div>

<div class="course" id="course-list"></div>

</section>

</div>


<!-- =====================
 MY COURSE
===================== -->

<div class="panel" id="mycourse">

<section>

<div class="label">
나만의 코스 만들기
</div>

<div class="type-buttons">

<button class="active" id="spot-type">
명소
</button>

<button id="food-type">
맛집
</button>

</div>

<div class="add-list" id="add-list"></div>

<div class="label" style="margin-top:20px;">
내가 만든 코스
(<span id="my-count">0</span>곳)
</div>

<div class="my-list" id="my-list"></div>

</section>

</div>


<!-- =====================
 MODAL
===================== -->

<div class="modal-bg" id="modal-bg">

<div class="modal">

<button class="modal-close" id="modal-close">
✕
</button>

<div class="modal-type" id="modal-type"></div>

<h2 id="modal-title"></h2>

<p id="modal-description"></p>

<button class="add-course" id="modal-add">
+ 내 코스에 담기
</button>

</div>

</div>


<!-- =====================
 BOTTOM NAV
===================== -->

<nav id="bottom-nav">

<button class="nav-btn active" data-target="home">
<span class="nav-icon">🏠</span>
홈
</button>

<button class="nav-btn" data-target="map-panel">
<span class="nav-icon">🗺️</span>
지도
</button>

<button class="nav-btn" data-target="course">
<span class="nav-icon">🧭</span>
코스
</button>

<button class="nav-btn" data-target="mycourse">
<span class="nav-icon">✏️</span>
마이코스
</button>

</nav>

</div>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ==================================================
   부산 바다 오늘
   모든 기능을 이 HTML 하나에서 처리
================================================== */


/* ==========================
   현재 날짜
========================== */

const today = new Date();

const days =
[
'일요일',
'월요일',
'화요일',
'수요일',
'목요일',
'금요일',
'토요일'
];

document.getElementById('date').textContent =
(today.getMonth()+1)
+'월 '
+(today.getDate())
+'일 · '
+days[today.getDay()];


/* ==========================
   장소 데이터
========================== */

const places = [

{

},

},

},

},

},

{

lng:129.1526
},

{

},

{
id:'cheongsapo',

lng:129.2008
},


/* 음식점 */

{
id:'food1',

name:'해운대 밀면집',
description:'부산의 대표적인 음식인 밀면을 맛볼 수 있는 음식점입니다.',

];


/* ==========================
   지도
========================== */

let map = null;

let markers = [];

let myLocationMarker = null;


/* ==========================
   지도 아이콘
========================== */

function makeIcon(type){

let color;
let emoji;

if(type === 'spot'){

color='#2878d7';
emoji='📍';

}

else if(type === 'food'){

color='#ef7350';
emoji='🍴';

}

else{

color='#3ba76b';
emoji='🏄';

}


return L.divIcon({

className:'custom-map-icon',

html:

'<div style="'
+
'width:32px;'
+
'height:32px;'
+
'background:'+color+';'
+
'border:3px solid white;'
+
'border-radius:50% 50% 50% 0;'
+
'transform:rotate(-45deg);'
+
'box-shadow:0 2px 7px rgba(0,0,0,.3);'
+
'">'
+
'<div style="'
+
'transform:rotate(45deg);'
+
'text-align:center;'
+
'line-height:26px;'
+
'font-size:13px;'
+
'">'
+
emoji
+
'</div>'
+
'</div>',

iconSize:[32,32],

iconAnchor:[16,32]

});

}


/* ==========================
   지도 만들기
========================== */

function initMap(){

if(map !== null){

setTimeout(function(){

map.invalidateSize();

},200);

return;

}


map =
L.map('map')
.setView(
[35.1532,129.1186],
11
);


L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

'© OpenStreetMap contributors',

/* ==========================
   핀 표시
========================== */

function showMarkers(filter){

if(!map){
return;
}


/* 기존 핀 제거 */

markers.forEach(function(marker){

map.removeLayer(marker);

});

markers=[];


/* 새 핀 생성 */

places.forEach(function(place){

if(
filter !== 'all'
&&
place.type !== filter
){

return;

}


let typeName='관광지';

if(place.type==='food'){

typeName='음식점';

}

if(place.type==='leisure'){

typeName='레저';

}


const marker =
L.marker(

[
place.lat,
place.lng
],

{
icon:makeIcon(place.type)
}

)
.addTo(map);


marker.bindPopup(

'<div style="min-width:150px;">'
+
'<strong>'
+
place.name
+
'</strong>'
+
'<br>'
+
'<span style="font-size:11px;color:#687875;">'
+
typeName
+
'</span>'
+
'<br><br>'
+
'<button '
+
'onclick="openPlace(\''+
place.id+
'\')" '
+
'style="border:0;background:#1b6e6a;color:white;padding:7px 10px;border-radius:8px;">'
+
'자세히 보기'
+
'</button>'
+
'</div>'

);


markers.push(marker);

});

}


/* ==========================
   현재 위치
========================== */

document
.getElementById('location-btn')
.addEventListener(
'click',
function(){

if(!navigator.geolocation){

alert(
'이 브라우저에서는 위치 기능을 사용할 수 없습니다.'
);

return;

}


this.textContent =
'📍 위치 찾는 중...';


navigator.geolocation.getCurrentPosition(

function(position){

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;


/* 기존 위치 핀 제거 */

if(myLocationMarker){

map.removeLayer(
myLocationMarker
);

}


/* 빨간색 현재 위치 */

myLocationMarker =
L.circleMarker(

[
lat,
lng
],

{

radius:9,

color:'#ffffff',

weight:3,

fillColor:'#e53935',

fillOpacity:1

}

).addTo(map);


myLocationMarker.bindPopup(
'<strong>🔴 현재 위치</strong>'
);


map.setView(
[lat,lng],
15
);


document
.getElementById('location-btn')
.textContent =
'📍 현재 위치';

},

function(error){

document
.getElementById('location-btn')
.textContent =
'📍 현재 위치';


if(error.code === 1){

alert(
'위치 권한을 허용해야 현재 위치를 확인할 수 있어요.'
);

}

else{

alert(
'현재 위치를 찾지 못했습니다.'
);

}

},

{

enableHighAccuracy:true,

timeout:10000,

maximumAge:0

}

);

}
);

/* ==========================

========================== */

function renderPlaces(){

const grid =
document.getElementById('place-grid');

grid.innerHTML='';


places
.filter(function(place){

return place.type === 'spot';

})
.forEach(function(place){

const card =
document.createElement('div');

card.className='place-card';


card.innerHTML =

'<div class="place-icon">📍</div>'
+
'<h3>'
+
place.name
+
'</h3>'
+
'<p>'
+
place.description.substring(0,35)
+
'...</p>';

'click',
function(){

openPlace(place.id);

});

});

}

renderPlaces();


/* ==========================
   장소 모달
========================== */

let selectedPlace = null;

function openPlace(id){

const place =
places.find(function(item){

return item.id === id;

});


if(!place){

return;

}


selectedPlace=place;


let typeName='관광지';

if(place.type==='food'){

typeName='음식점';

}

if(place.type==='leisure'){

typeName='레저';

}


document.getElementById('modal-type')
.textContent =
typeName;

document.getElementById('modal-title')
.textContent =
place.name;

document.getElementById('modal-description')
.textContent =
place.description;


document
.getElementById('modal-bg')
.classList.add('open');

}


/* ==========================
   모달 닫기
========================== */

document
.getElementById('modal-close')
.addEventListener(
'click',
function(){

document
.getElementById('modal-bg')
.classList.remove('open');

});


document
.getElementById('modal-bg')
.addEventListener(
'click',
function(event){

if(event.target === this){

this.classList.remove('open');

}

});


/* ==========================
   마이코스
========================== */

let myCourse =
JSON.parse(
localStorage.getItem('busanMyCourse') || '[]'
);


function saveMyCourse(){

localStorage.setItem(
'busanMyCourse',
JSON.stringify(myCourse)
);

}


function renderMyCourse(){

const list =
document.getElementById('my-list');

const count =
document.getElementById('my-count');


count.textContent =
myCourse.length;


list.innerHTML='';


if(myCourse.length===0){

list.innerHTML =
'<div class="empty">'
+
'아직 추가한 장소가 없어요.'
+
'</div>';

return;

}


myCourse.forEach(function(id,index){

const place =
places.find(function(item){

return item.id===id;

});


if(!place){

return;

}


const item =
document.createElement('div');

item.className='my-item';


item.innerHTML =

'<div class="my-num">'
+
(index+1)
+
'</div>'
+
'<div class="my-name">'
+
place.name
+
'</div>'
+
'<button class="remove">✕</button>';


item
.querySelector('.remove')
.addEventListener(
'click',
function(){

myCourse =
myCourse.filter(function(itemId){

return itemId !== id;

});


saveMyCourse();

renderMyCourse();

renderAddList();

});


list.appendChild(item);

});

}


function renderAddList(){

const list =
document.getElementById('add-list');

list.innerHTML='';


const currentType =
document
.querySelector('#spot-type')
.classList
.contains('active')
?'spot'
:'food';


places
.filter(function(place){

return place.type===currentType;

})
.forEach(function(place){

const button =
document.createElement('button');

button.className='add-place';

const already =
myCourse.includes(place.id);


button.textContent =
already
?'✓ '+place.name
:'+ '+place.name;


button.addEventListener(
'click',
function(){

if(!myCourse.includes(place.id)){

myCourse.push(place.id);

saveMyCourse();

renderMyCourse();

renderAddList();

}

});


list.appendChild(button);

});

}


document
.getElementById('spot-type')
.addEventListener(
'click',
function(){

this.classList.add('active');

document
.getElementById('food-type')
.classList.remove('active');

renderAddList();

});


document
.getElementById('food-type')
.addEventListener(
'click',
function(){

this.classList.add('active');

document
.getElementById('spot-type')
.classList.remove('active');

renderAddList();

});


/* 모달에서 코스 추가 */

document
.getElementById('modal-add')
.addEventListener(
'click',
function(){

if(!selectedPlace){

return;

}


if(!myCourse.includes(selectedPlace.id)){

myCourse.push(selectedPlace.id);

saveMyCourse();

renderMyCourse();

renderAddList();

this.textContent =
'✓ 내 코스에 추가됨';

}

else{

this.textContent =
'이미 내 코스에 있어요';

}

});


renderMyCourse();

renderAddList();

========================== */

const courses = {

solo:[

['오전','흰여울문화마을','spot'],
['점심','흰여울 바다 카페','food'],
['오후','청사포','spot']

],

couple:[

['오전','다대포 해수욕장','spot'],
['점심','광안리 게장정식집','food'],
['저녁','광안리 해수욕장','spot']

],

family:[

['오전','해운대 해수욕장','spot'],
['점심','해운대 밀면집','food'],
['오후','동백섬','spot']

],

friends:[

['오전','송정 해수욕장','spot'],
['점심','송정 브런치 카페','food'],
['오후','송정 서핑','leisure']

]

};


function renderCourse(group){

const box =
document.getElementById('course-list');

box.innerHTML='';


courses[group].forEach(function(item){

const row =
document.createElement('div');

row.className='course-item';


row.innerHTML =

'<div class="course-icon '
+
(item[2]==='food'
?'course-food'
:'')
+
'">'
+
(item[2]==='food'
?'🍴'
:item[2]==='leisure'
?'🏄'
:'📍')
+
'</div>'
+
'<div>'
+
'<div class="course-time">'
+
item[0]
+
'</div>'
+
'<div class="course-title">'
+
item[1]
+
'</div>'
+
'<div class="course-desc">'
+
'추천 코스 장소'
+
'</div>'
+
'</div>';


row.addEventListener(
'click',
function(){

const place =
places.find(function(p){

return p.name===item[1];

});

if(place){

openPlace(place.id);

}

});


box.appendChild(row);

});

}


renderCourse('solo');

document

   하단 메뉴
========================== */

document
.querySelectorAll('.nav-btn')
.forEach(function(button){

button.addEventListener(
'click',
function(){

const target =
this.dataset.target;


/* 모든 패널 숨기기 */

document
.querySelectorAll('.panel')
.forEach(function(panel){

panel.classList.remove('active');

});

.getElementById(target)

.querySelectorAll('.nav-btn')
.forEach(function(btn){

});

setTimeout(
function(){

initMap();

if(map){

map.invalidateSize();

}

},
100
);

}

});

});
