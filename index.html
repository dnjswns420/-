<!DOCTYPE html><html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부산 바다, 오늘</title><link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}

body{
margin:0;
background:#f4ecd8;
font-family:Arial,"Noto Sans KR",sans-serif;
color:#123b3d;
}

button{font-family:inherit;cursor:pointer}

#app{
max-width:460px;
min-height:100vh;
margin:auto;
background:#f4ecd8;
padding-bottom:80px;
}

header{
background:#0c393d;
color:white;
padding:25px 22px 30px;
}

.small{
font-size:11px;
color:#9ed1c7;
font-weight:bold;
margin-bottom:7px;
}

h1{
margin:0 0 7px;
font-size:27px;
}

.subtitle{
font-size:12px;
color:#c4ded8;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

section{
padding:20px;
}

.label{
font-size:12px;
font-weight:bold;
color:#176c67;
margin-bottom:10px;
}

/* 홈 */

.trends{
display:flex;
gap:7px;
overflow-x:auto;
}

.trend{
border:1px solid #d9e1dc;
background:white;
border-radius:20px;
padding:9px 13px;
font-size:11px;
white-space:nowrap;
}

.brief{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.brief h2{
margin:0 0 7px;
font-size:21px;
}

.brief p{
font-size:13px;
line-height:1.6;
color:#5d706d;
}

.metrics{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.metric{
background:#f4ecd8;
border-radius:11px;
text-align:center;
padding:10px 3px;
}

.metric strong{
display:block;
font-size:14px;
}

.metric span{
font-size:9px;
color:#71827f;
}

.beaches{
display:flex;
gap:7px;
overflow-x:auto;
}

.beach{
border:1px solid #d5dfda;
background:white;
border-radius:18px;
padding:8px 13px;
white-space:nowrap;
}

.beach.active{
background:#176c67;
color:white;
}

/* 지도 */

.map-filter{
display:flex;
gap:6px;
margin-bottom:10px;
overflow-x:auto;
}

.map-filter button{
border:1px solid #d5dfda;
background:white;
border-radius:20px;
padding:8px 12px;
font-size:11px;
white-space:nowrap;
}

.map-filter button.active{
background:#176c67;
color:white;
}

.map-wrap{
height:470px;
border-radius:18px;
overflow:hidden;
position:relative;
box-shadow:0 5px 15px rgba(0,0,0,.12);
}

#map{
width:100%;
height:100%;
}

.current-btn{
position:absolute;
right:12px;
bottom:12px;
z-index:1000;
border:0;
background:white;
border-radius:11px;
padding:11px 13px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.legend{
font-size:10px;
color:#657773;
margin-top:9px;
display:flex;
gap:10px;
}

/* 장소 */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.07);
}

.card .emoji{
font-size:25px;
}

.card h3{
font-size:14px;
margin:7px 0 4px;
}

.card p{
font-size:10px;
line-height:1.5;
color:#71817e;
}

/* 코스 */

.groups{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.group{
background:white;
border:1px solid #d7dfdb;
border-radius:12px;
padding:11px 3px;
text-align:center;
}

.group.active{
background:#ef7653;
color:white;
}

.group span{
display:block;
font-size:18px;
margin-bottom:3px;
}

.group b{
font-size:10px;
}

.course{
background:white;
border-radius:17px;
padding:10px 15px;
box-shadow:0 5px 15px rgba(0,0,0,.07);
}

.course-item{
padding:14px 0;
border-bottom:1px solid #edf0ee;
display:flex;
gap:10px;
}

.course-item:last-child{
border-bottom:0;
}

.course-number{
width:32px;
height:32px;
border-radius:50%;
background:#176c67;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
flex-shrink:0;
}

.course-item h3{
font-size:13px;
margin:0 0 3px;
}

.course-item p{
font-size:10px;
color:#75837f;
margin:0;
}

/* 마이코스 */

.type-buttons{
display:flex;
gap:8px;
}

.type-buttons button{
flex:1;
border:0;
padding:10px;
border-radius:10px;
background:#e8e1d0;
font-weight:bold;
}

.type-buttons button.active{
background:#176c67;
color:white;
}

.add-list{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:12px;
}

.add-place{
border:0;
background:white;
border-radius:18px;
padding:8px 11px;
font-size:10px;
}

.my-item{
display:flex;
align-items:center;
gap:8px;
background:white;
padding:10px;
border-radius:10px;
margin-bottom:7px;
}

.num{
width:23px;
height:23px;
border-radius:50%;
background:#176c67;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
}

.my-name{
flex:1;
font-size:11px;
font-weight:bold;
}

.remove{
border:0;
background:transparent;
font-size:15px;
}

/* 모달 */

.modal-bg{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:3000;
align-items:flex-end;
}

.modal-bg.open{
display:flex;
}

.modal{
width:100%;
max-width:460px;
margin:auto;
background:white;
border-radius:20px 20px 0 0;
padding:22px;
}

.close{
float:right;
border:0;
border-radius:50%;
width:30px;
height:30px;
}

.modal-type{
font-size:11px;
color:#176c67;
font-weight:bold;
margin-top:10px;
}

.modal h2{
font-size:21px;
margin:8px 0;
}

.modal p{
font-size:13px;
line-height:1.6;
color:#647470;
}

.modal-add{
width:100%;
border:0;
background:#ef7653;
color:white;
padding:12px;
border-radius:10px;
font-weight:bold;
}

/* 하단 */

#nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
max-width:460px;
margin:auto;
background:white;
border-top:1px solid #ddd;
display:flex;
z-index:2000;
}

.nav{
flex:1;
border:0;
background:white;
color:#84918f;
font-size:10px;
font-weight:bold;
}

.nav .icon{
display:block;
font-size:20px;
margin-bottom:3px;
}

.nav.active{
color:#176c67;
}
</style></head><body><div id="app"><header>
<div class="small" id="date"></div>
<h1>부산 바다, 오늘</h1>
<div class="subtitle">
그날의 바다를 읽고, 오늘 가장 좋은 코스를 추천해요
</div>
</header><!-- 홈 --><div class="panel active" id="home"><section>
<div class="label">오늘의 인기 검색어</div><div class="trends">
<div class="trend">#다대포노을</div>
<div class="trend">#광안리</div>
<div class="trend">#흰여울문화마을</div>
<div class="trend">#송정서핑</div>
</div>
</section><section>
<div class="label">오늘의 바다 브리핑</div><div class="brief">
<h2 id="beachName">해운대</h2><p id="beachText">
파도가 잔잔하고 하늘이 맑아요.
산책과 사진 찍기 좋은 날입니다.
</p><div class="metrics">
<div class="metric">
<strong id="wave">0.3m</strong>
<span>파도 높이</span>
</div><div class="metric">
<strong id="temp">24°C</strong>
<span>수온</span>
</div><div class="metric">
<strong id="tide">간조 14:20</strong>
<span>물때</span>
</div>
</div>
</div>
</section><section>
<div class="label">해변 선택</div><div class="beaches"><button class="beach active" data-beach="해운대">해운대</button>
<button class="beach" data-beach="광안리">광안리</button>
<button class="beach" data-beach="송정">송정</button>
<button class="beach" data-beach="다대포">다대포</button>

</div>
</section></div><!-- 지도 --><div class="panel" id="mapPanel"><section><div class="label">부산 전체 위치 지도</div><div class="map-filter">
<button class="active" data-filter="all">전체</button>
<button data-filter="spot">🔵 관광지</button>
<button data-filter="food">🟠 음식점</button>
<button data-filter="leisure">🟢 레저</button>
</div><div class="map-wrap">
<div id="map"></div><button class="current-btn" id="currentBtn">
📍 현재 위치
</button>
</div><div class="legend">
<span>🔵 관광지</span>
<span>🟠 음식점</span>
<span>🟢 레저</span>
<span>🔴 내 위치</span>
</div></section>
</div><!-- 명소 --><div class="panel" id="placesPanel"><section>
<div class="label">부산 바다 명소</div>
<div class="grid" id="placeGrid"></div>
</section></div><!-- 코스 --><div class="panel" id="coursePanel"><section>
<div class="label">누구와 가시나요?</div><div class="groups"><button class="group active" data-group="solo">
<span>🚶</span>
<b>혼자</b>
</button><button class="group" data-group="couple">
<span>💑</span>
<b>커플</b>
</button><button class="group" data-group="family">
<span>👨‍👩‍👧</span>
<b>가족</b>
</button><button class="group" data-group="friends">
<span>🎉</span>
<b>친구</b>
</button></div>
</section><section>
<div class="label">오늘의 추천 코스</div>
<div class="course" id="courseList"></div>
</section></div><!-- 마이코스 --><div class="panel" id="myPanel"><section><div class="label">나만의 코스 만들기</div><div class="type-buttons">
<button class="active" id="spotButton">명소</button>
<button id="foodButton">맛집</button>
</div><div class="add-list" id="addList"></div><div class="label" style="margin-top:20px">
내가 만든 코스 (<span id="count">0</span>곳)
</div><div id="myList"></div></section></div><!-- 장소 상세 --><div class="modal-bg" id="modalBg"><div class="modal"><button class="close" id="closeModal">✕</button>

<div class="modal-type" id="modalType"></div><h2 id="modalTitle"></h2><p id="modalDescription"></p><button class="modal-add" id="modalAdd">
+ 내 코스에 담기
</button></div>
</div><!-- 하단 메뉴 --><nav id="nav"><button class="nav active" data-target="home">
<span class="icon">🏠</span>
홈
</button><button class="nav" data-target="mapPanel">
<span class="icon">🗺️</span>
지도
</button><button class="nav" data-target="coursePanel">
<span class="icon">🧭</span>
코스
</button><button class="nav" data-target="myPanel">
<span class="icon">✏️</span>
마이코스
</button></nav></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>

/* =========================
날짜
========================= */

const now = new Date();

const dayNames = [
"일요일","월요일","화요일",
"수요일","목요일","금요일","토요일"
];

document.getElementById("date").textContent =
(now.getMonth()+1)+"월 "+
now.getDate()+"일 · "+
dayNames[now.getDay()];


/* =========================
장소 데이터
========================= */

const places = [

{
id:"haeundae",
type:"spot",
name:"해운대 해수욕장",
description:"부산을 대표하는 해수욕장으로 넓은 백사장과 바다 풍경을 즐길 수 있습니다.",
lat:35.1587,
lng:129.1604
},

{
id:"gwangalli",
type:"spot",
name:"광안리 해수욕장",
description:"광안대교와 바다 풍경을 함께 볼 수 있는 부산 대표 명소입니다.",
lat:35.1532,
lng:129.1186
},

{
id:"songjeong",
type:"spot",
name:"송정 해수욕장",
description:"부산 동쪽 해안에 위치한 해변으로 산책과 해양 레저를 즐길 수 있습니다.",
lat:35.1789,
lng:129.1991
},

{
id:"dadaepo",
type:"spot",
name:"다대포 해수욕장",
description:"넓은 해변과 노을을 즐길 수 있는 부산의 대표적인 해안 명소입니다.",
lat:35.0462,
lng:128.9662
},

{
id:"huinnyeoul",
type:"spot",
name:"흰여울문화마을",
description:"영도의 바다와 골목길 풍경을 함께 볼 수 있는 관광지입니다.",
lat:35.0788,
lng:129.0450
},

{
id:"dongbaek",
type:"spot",
name:"동백섬",
description:"해운대 주변의 해안 산책로와 자연 경관을 즐길 수 있습니다.",
lat:35.1532,
lng:129.1526
},

{
id:"songdo",
type:"spot",
name:"송도 해수욕장",
description:"부산 서쪽 해안의 대표적인 관광지입니다.",
lat:35.0750,
lng:129.0170
},

{
id:"cheongsapo",
type:"spot",
name:"청사포",
description:"해안 풍경과 다릿돌전망대를 볼 수 있는 곳입니다.",
lat:35.1600,
lng:129.2008
},

{
id:"food1",
type:"food",
name:"해운대 밀면",
description:"부산의 대표 음식인 밀면을 맛볼 수 있는 음식점 예시입니다.",
lat:35.1612,
lng:129.1635
},

{
id:"food2",
type:"food",
name:"광안리 식당",
description:"광안리 주변에서 식사를 즐길 수 있는 음식점 예시입니다.",
lat:35.1535,
lng:129.1180
},

{
id:"food3",
type:"food",
name:"다대포 해산물 식당",
description:"다대포 주변에서 해산물 요리를 즐길 수 있는 음식점 예시입니다.",
lat:35.0465,
lng:128.9668
},

{
id:"food4",
type:"food",
name:"송정 바다 카페",
description:"송정 바다를 바라보며 쉬어갈 수 있는 카페 예시입니다.",
lat:35.1793,
lng:129.1985
},

{
id:"food5",
type:"food",
name:"흰여울 카페",
description:"영도의 바다 풍경을 바라보며 쉬어갈 수 있는 카페 예시입니다.",
lat:35.0785,
lng:129.0445
},

{
id:"leisure1",
type:"leisure",
name:"송정 서핑",
description:"송정 해변에서 즐길 수 있는 대표적인 해양 레저 활동입니다.",
lat:35.1789,
lng:129.1991
},

{
id:"leisure2",
type:"leisure",
name:"송도 해상 케이블카",
description:"바다 위에서 부산의 해안 경관을 감상할 수 있는 관광 시설입니다.",
lat:35.0762,
lng:129.0177
},

{
id:"leisure3",
type:"leisure",
name:"다대포 해안 체험",
description:"다대포의 해안 환경을 관찰할 수 있는 체험 활동 예시입니다.",
lat:35.0462,
lng:128.9662
}

];


/* =========================
하단 메뉴
========================= */

document.querySelectorAll(".nav").forEach(function(btn){

btn.addEventListener("click",function(){

document.querySelectorAll(".panel").forEach(function(panel){
panel.classList.remove("active");
});

document.getElementById(
this.dataset.target
).classList.add("active");

document.querySelectorAll(".nav").forEach(function(n){
n.classList.remove("active");
});

this.classList.add("active");

window.scrollTo(0,0);

if(this.dataset.target === "mapPanel"){
setTimeout(function(){
initMap();
map.invalidateSize();
},100);
}

});

});


/* =========================
해변 버튼
========================= */

const beachData = {

"해운대":{
wave:"0.3m",
temp:"24°C",
tide:"간조 14:20",
text:"파도가 잔잔하고 하늘이 맑아요. 산책과 사진 찍기 좋은 날입니다."
},

"광안리":{
wave:"0.5m",
temp:"23°C",
tide:"만조 11:40",
text:"광안대교와 바다 풍경을 함께 즐기기 좋은 곳입니다."
},

"송정":{
wave:"0.8m",
temp:"22°C",
tide:"간조 15:10",
text:"파도가 조금 있어 해양 레저를 즐기기 좋은 장소입니다."
},

"다대포":{
wave:"0.2m",
temp:"24°C",
tide:"간조 13:50",
text:"넓은 해변과 노을을 즐기기 좋은 곳입니다."
}

};

document.querySelectorAll(".beach").forEach(function(btn){

btn.addEventListener("click",function(){

document.querySelectorAll(".beach").forEach(function(b){
b.classList.remove("active");
});

this.classList.add("active");

const data = beachData[this.dataset.beach];

document.getElementById("beachName").textContent =
this.dataset.beach;

document.getElementById("beachText").textContent =
data.text;

document.getElementById("wave").textContent =
data.wave;

document.getElementById("temp").textContent =
data.temp;

document.getElementById("tide").textContent =
data.tide;

});

});


/* =========================
지도
========================= */

let map = null;
let markers = [];
let currentMarker = null;

function initMap(){

if(map !== null){
return;
}

map = L.map("map").setView(
[35.1532,129.1186],
11
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap contributors"
}
).addTo(map);

showMarkers("all");

}


/* 핀 색깔 */

function getColor(type){

if(type === "food"){
return "#ef7653";
}

if(type === "leisure"){
return "#3da66a";
}

return "#2878d7";

}


/* 지도 핀 */

function showMarkers(filter){

if(!map){
return;
}

markers.forEach(function(marker){
map.removeLayer(marker);
});

markers = [];

places.forEach(function(place){

if(
filter !== "all" &&
place.type !== filter
){
return;
}

const marker = L.circleMarker(
[place.lat,place.lng],
{
radius:9,
color:"#ffffff",
weight:3,
fillColor:getColor(place.type),
fillOpacity:1
}
).addTo(map);

let typeName = "관광지";

if(place.type === "food"){
typeName = "음식점";
}

if(place.type === "leisure"){
typeName = "레저";
}

marker.bindPopup(
"<b>"+place.name+"</b><br>"+
"<small>"+typeName+"</small><br><br>"+
"<button onclick=\"openPlace('"+
place.id+
"')\" style=\"background:#176c67;color:white;border:0;padding:7px 10px;border-radius:7px\">"+
"자세히 보기"+
"</button>"
);

markers.push(marker);

});

}


/* 지도 필터 */

document.querySelectorAll(".map-filter button")
.forEach(function(btn){

btn.addEventListener("click",function(){

document.querySelectorAll(".map-filter button")
.forEach(function(b){
b.classList.remove("active");
});

this.classList.add("active");

showMarkers(this.dataset.filter);

});

});


/* =========================
현재 위치
========================= */

document.getElementById("currentBtn")
.addEventListener("click",function(){

if(!navigator.geolocation){

alert("이 브라우저에서는 위치 기능을 사용할 수 없습니다.");
return;

}

const button = this;

button.textContent = "📍 위치 찾는 중...";

navigator.geolocation.getCurrentPosition(

function(position){

const lat = position.coords.latitude;
const lng = position.coords.longitude;

if(currentMarker){
map.removeLayer(currentMarker);
}

currentMarker =
L.circleMarker(
[lat,lng],
{
radius:10,
color:"#fff",
weight:3,
fillColor:"#e53935",
fillOpacity:1
}
).addTo(map);

currentMarker.bindPopup(
"<b>🔴 현재 위치</b>"
).openPopup();

map.setView(
[lat,lng],
15
);

button.textContent = "📍 현재 위치";

},

function(){

button.textContent = "📍 현재 위치";

alert(
"현재 위치를 사용하려면 브라우저에서 위치 권한을 허용해주세요."
);

},

{
enableHighAccuracy:true,
timeout:10000,
maximumAge:0
}

);

});


/* =========================
명소 카드
========================= */

function renderPlaces(){

const grid =
document.getElementById("placeGrid");

grid.innerHTML = "";

places
.filter(function(p){
return p.type === "spot";
})
.forEach(function(place){

const card =
document.createElement("div");

card.className = "card";

card.innerHTML =
'<div class="emoji">📍</div>'+
'<h3>'+place.name+'</h3>'+
'<p>'+place.description+'</p>';

card.addEventListener("click",function(){
openPlace(place.id);
});

grid.appendChild(card);

});

}

renderPlaces();


/* =========================
장소 모달
========================= */

let selectedPlace = null;

function openPlace(id){

const place =
places.find(function(p){
return p.id === id;
});

if(!place){
return;
}

selectedPlace = place;

let typeName = "관광지";

if(place.type === "food"){
typeName = "음식점";
}

if(place.type === "leisure"){
typeName = "레저";
}

document.getElementById("modalType").textContent =
typeName;

document.getElementById("modalTitle").textContent =
place.name;

document.getElementById("modalDescription").textContent =
place.description;

document.getElementById("modalBg").classList.add("open");

}


document.getElementById("closeModal")
.addEventListener("click",function(){

document.getElementById("modalBg")
.classList.remove("open");

});


document.getElementById("modalBg")
.addEventListener("click",function(e){

if(e.target === this){
this.classList.remove("open");
}

});


/* =========================
마이코스
========================= */

let myCourse =
JSON.parse(
localStorage.getItem("busanMyCourse") || "[]"
);


function saveCourse(){

localStorage.setItem(
"busanMyCourse",
JSON.stringify(myCourse)
);

}


function renderMyCourse(){

const list =
document.getElementById("myList");

document.getElementById("count").textContent =
myCourse.length;

list.innerHTML = "";

if(myCourse.length === 0){

list.innerHTML =
'<div style="text-align:center;padding:20px;color:#8c9a97;font-size:11px">'+
"아직 추가한 장소가 없어요."+
"</div>";

return;

}

myCourse.forEach(function(id,index){

const place =
places.find(function(p){
return p.id === id;
});

if(!place){
return;
}

const item =
document.createElement("div");

item.className = "my-item";

item.innerHTML =
'<div class="num">'+(index+1)+'</div>'+
'<div class="my-name">'+place.name+'</div>'+
'<button class="remove">✕</button>';

item.querySelector(".remove")
.addEventListener("click",function(){

myCourse =
myCourse.filter(function(x){
return x !== id;
});

saveCourse();
renderMyCourse();
renderAddList();

});

list.appendChild(item);

});

}


function renderAddList(){

const list =
document.getElementById("addList");

list.innerHTML = "";

const type =
document.getElementById("spotButton")
.classList.contains("active")
? "spot"
: "food";

places
.filter(function(p){
return p.type === type;
})
.forEach(function(place){

const btn =
document.createElement("button");

btn.className = "add-place";

const already =
myCourse.includes(place.id);

btn.textContent =
already
? "✓ "+place.name
: "+ "+place.name;

btn.addEventListener("click",function(){

if(!myCourse.includes(place.id)){

myCourse.push(place.id);

saveCourse();
renderMyCourse();
renderAddList();

}

});

list.appendChild(btn);

});

}


document.getElementById("spotButton")
.addEventListener("click",function(){

this.classList.add("active");
document.getElementById("foodButton")
.classList.remove("active");

renderAddList();

});


document.getElementById("foodButton")
.addEventListener("click",function(){

this.classList.add("active");
document.getElementById("spotButton")
.classList.remove("active");

renderAddList();

});


document.getElementById("modalAdd")
.addEventListener("click",function(){

if(!selectedPlace){
return;
}

if(!myCourse.includes(selectedPlace.id)){

myCourse.push(selectedPlace.id);

saveCourse();
renderMyCourse();
renderAddList();

this.textContent = "✓ 내 코스에 추가됨";

}else{

this.textContent = "이미 추가된 장소입니다";

}

});


renderMyCourse();
renderAddList();


/* =========================
추천 코스
========================= */

const courses = {

solo:[
"흰여울문화마을",
"흰여울 카페",
"청사포"
],

couple:[
"다대포 해수욕장",
"광안리 식당",
"광안리 해수욕장"
],

family:[
"해운대 해수욕장",
"해운대 밀면",
"동백섬"
],

friends:[
"송정 해수욕장",
"송정 바다 카페",
"송정 서핑"
]

};


function renderCourse(group){

const box =
document.getElementById("courseList");

box.innerHTML = "";

courses[group].forEach(function(name,index){

const place =
places.find(function(p){
return p.name === name;
});

const item =
document.createElement("div");

item.className = "course-item";

item.innerHTML =
'<div class="course-number">'+
(index+1)+
'</div>'+
'<div>'+
'<h3>'+name+'</h3>'+
'<p>추천 코스 장소 · 눌러서 자세히 보기</p>'+
'</div>';

if(place){

item.addEventListener("click",function(){
openPlace(place.id);
});

}

box.appendChild(item);

});

}

renderCourse("solo");


document.querySelectorAll(".group")
.forEach(function(btn){

btn.addEventListener("click",function(){

document.querySelectorAll(".group")
.forEach(function(b){
b.classList.remove("active");
});

this.classList.add("active");

renderCourse(this.dataset.group);

});

});
